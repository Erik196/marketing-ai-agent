[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpilot-ai"
version = "0.1.0"
description = "A phase-by-phase AI marketing agent learning project"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.23.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marketpilot = "marketpilot.cli:main"

[tool.setuptools.packages.find]
include = ["marketpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

